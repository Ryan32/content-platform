AWSTemplateFormatVersion: '2010-09-09'
Description: AE Library (apps/platform) dev database role passwords and Payload secret. Values are generated by Secrets Manager.
Resources:
  RuntimePassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: aecp-dev-library-db-runtime
      Description: Password for the aecp_library_runtime PostgreSQL role.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
  MigrationPassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: aecp-dev-library-db-migration
      Description: Password for the aecp_library_migration PostgreSQL role.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
  PayloadSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: aecp-dev-library-payload-secret
      Description: PAYLOAD_SECRET for the AE Library application.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
  SessionSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: aecp-dev-library-session-secret
      Description: AUTH_SESSION_SECRET used to encrypt AE Library browser session cookies.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
Outputs:
  SessionSecretArn:
    Value: !Ref SessionSecret
  RuntimePasswordArn:
    Value: !Ref RuntimePassword
  MigrationPasswordArn:
    Value: !Ref MigrationPassword
  PayloadSecretArn:
    Value: !Ref PayloadSecret
